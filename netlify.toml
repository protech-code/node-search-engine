[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "BASE_URL,SEARCH_PROVIDER,PORT"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"
  included_files = ["src/**", "views/**", "public/**", "package.json"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
